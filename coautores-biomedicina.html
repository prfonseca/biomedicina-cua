<style>
.eico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;
  border:1px solid #444;background:#2a2a3e;text-decoration:none;cursor:pointer;flex-shrink:0;
  position:relative;transition:all .15s;margin-left:4px;vertical-align:middle;}
.eico:hover{background:#003d7c;border-color:#003d7c;transform:translateY(-1px);}
.eico svg{width:11px;height:11px;}
.eico::after{content:attr(title);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;font-size:10px;padding:3px 7px;border-radius:4px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;}
.eico:hover::after{opacity:1;}
.profscol{max-width:220px}
.prof-chip{display:inline-block;background:#eef3fb;color:#003d7c;border:1px solid #d3e3f7;border-radius:4px;
  padding:1px 6px;margin:0 3px 3px 0;font-size:10.5px;text-decoration:none;white-space:nowrap;transition:background .15s}
.prof-chip:hover{background:#003d7c;color:#fff}
.prof-chip.off{background:#f2f2f2;color:#999;border-color:#e0e0e0;cursor:default}
.no-profs{color:#bbb;font-size:11px}
</style>

function profsHtml(r){
  if (!r.profs || !r.profs.length) return '<span class="no-profs">—</span>';
  return r.profs.map(p => {
    const slug = PROF_SLUGS[p];
    const short = p.split(' ').filter(w => w.length > 2).slice(0,2).join(' ');
    return slug
      ? `<a class="prof-chip" href="${slug}" title="${p}">${short}</a>`
      : `<span class="prof-chip off" title="${p}">${short}</span>`;
  }).join('');
}

function egrLinksHtml(r){
  const L = r.links;
  if (!L) return '';
  let h = '';
  ['lattes','scholar','orcid','sciprofiles','researchgate','scopus','webofscience','linkedin','facebook','twitter'].forEach(k => {
    if (L[k]) h += `<a class="eico" href="${L[k]}" target="_blank" rel="noopener" title="${EGR_ICON[k].title}">${EGR_ICON[k].svg}</a>`;
  });
  return h;
}
function render(){
  const q=N(document.getElementById('busca').value.trim());
  const catF=document.getElementById('catFiltro').value;
  let rows=DATA.slice();
  if(q) rows=rows.filter(r=>N(r.name).includes(q));
  if(catF) rows=rows.filter(r=>r.category===catF || (catF==='professor_icbs' && r.also_icbs));
  const profF=document.getElementById('profFiltro').value;
  if(profF) rows=rows.filter(r=>(r.profs||[]).includes(profF));
  if(cur==='az')     rows.sort((a,b)=>N(a.name).localeCompare(N(b.name)));
  if(cur==='za')     rows.sort((a,b)=>N(b.name).localeCompare(N(a.name)));
  if(cur==='freq')   rows.sort((a,b)=>b.count-a.count||N(a.name).localeCompare(N(b.name)));
  if(cur==='freqaz') rows.sort((a,b)=>a.count-b.count||N(a.name).localeCompare(N(b.name)));
  document.getElementById('an').textContent =cur==='az'?'↑':cur==='za'?'↓':'↕';
  document.getElementById('an2').textContent=cur==='az'?'↑':cur==='za'?'↓':'';
  document.getElementById('ac').textContent =cur==='freq'?'↓':cur==='freqaz'?'↑':'↕';
  const frag=document.createDocumentFragment();
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    const classes=['cat-'+(r.category||'pendente')];
    if(r.category==='aluno_em_formacao') classes.push('formacao');
    tr.className=classes.join(' ');
    const fo=r.category==='aluno_em_formacao'?'<span class="tag tag-f">📚 Formação</span>':'';
    const catBadge=CAT_LABEL[r.category]||CAT_LABEL.pendente;
    const nota=r.nota?`<div style="font-size:10px;color:#888;margin-top:2px">${r.nota}</div>`:'';
    const aliases=(r.variantes&&r.variantes.length)?`<span class="alias-list">${r.variantes.join(', ')}</span>`:'<span style="color:#ccc">—</span>';
    tr.innerHTML=`<td class="num">${i+1}</td><td>${r.name}${egrLinksHtml(r)}${fo}${nota}</td><td>${catBadge}</td><td class="aliascol">${aliases}</td><td class="profscol">${profsHtml(r)}</td><td class="cnt"><span class="badge">${r.count}x</span></td>`;
    frag.appendChild(tr);
  });
  const tb=document.getElementById('tbody');tb.innerHTML='';tb.appendChild(frag);
  document.getElementById('foot').textContent=rows.length<DATA.length?`Exibindo ${rows.length} de ${DATA.length}`:'';
}

const ctPE=DATA.filter(r=>['professor_externo','pesquisador_externo','professor_unesp','professor_unifesp','professor_ufr','professor_ufmg','professor_unicamp','professor_ufscar','professor_uncisal','professor_usp','professor_ufg','professor_ifsp','professor_ifmt','pesquisador_cbpf','professor_univem','professor_unicathedral','pesquisador_unesp'].includes(r.category)).length;
const ctColab=DATA.filter(r=>r.category==='professor_ufmt'&&/^Docente UFMT/.test(r.nota||'')).length;
  const ctInst=DATA.filter(r=>['professor_icbs','professor_icet','professor_ichs','pesquisador_ufmt'].includes(r.category)||(r.category==='professor_ufmt'&&!/^Docente UFMT/.test(r.nota||''))).length;
const ctPD=DATA.filter(r=>r.category==='pendente').length;
const fo=DATA.filter(r=>r.category==='aluno_em_formacao').length;
document.getElementById('stats').innerHTML=`<b>${DATA.length}</b> co-autores únicos &nbsp;·&nbsp; <b>${ctPC}</b> professores do curso &nbsp;·&nbsp; <b>${ctEG}</b> egressos &nbsp;·&nbsp; <b>${ctPE}</b> externos &nbsp;·&nbsp; <b>${ctInst}</b> de outros institutos UFMT &nbsp;·&nbsp; <b>${ctColab}</b> docentes UFMT (possíveis colaboradores) &nbsp;·&nbsp; <b>${ctPD}</b> pendentes &nbsp;·&nbsp; <b>${fo}</b> em formação`;
(function(){
  const set=new Set();
  DATA.forEach(r=>(r.profs||[]).forEach(p=>{if(p)set.add(p);}));
  const sel=document.getElementById('profFiltro');
  Array.from(set).sort((a,b)=>a.localeCompare(b,'pt')).forEach(p=>{
    const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);
  });
})();
render();
</script>
</body></html>
