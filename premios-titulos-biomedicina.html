<title>Prêmios e Títulos — Biomedicina UFMT Araguaia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#003d7c;--blue2:#0059b3;--gold:#c8960c;
  --bg:#f4f6fa;--card:#fff;--text:#1a2333;--muted:#5a6a7e;--border:#dde3ec;
  --sans:var(--font);--serif:var(--font-display);
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px}
h1{font-family:var(--serif);font-size:1.7rem;color:var(--blue);margin-bottom:6px}
.subtitle{font-size:13.5px;color:var(--muted);margin-bottom:10px;max-width:920px;line-height:1.5}
.subtitle b{color:var(--text)}
.pending-note{font-size:12px;color:#8a6d1c;background:#fff8e6;border:1px solid #f0dfa8;border-radius:8px;padding:10px 14px;margin-bottom:18px;max-width:920px;line-height:1.5}
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.stat-pill{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px}
.stat-pill .sv{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--blue);line-height:1}
.stat-pill .sl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;line-height:1.3}
.ctrl-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.ctrl-grp{display:flex;flex-direction:column;gap:4px}
.ctrl-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select,input{font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
.tbl-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;overflow-x:auto}
.tbl-card h2{font-family:var(--serif);font-size:14px;color:var(--blue);margin-bottom:4px}
.tbl-card .sub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
tr:hover td{background:#fafbfd}
td.ano{font-family:var(--serif);color:var(--blue);font-weight:700;white-space:nowrap}
a.proflink{color:var(--blue);text-decoration:none;font-weight:600}
a.proflink:hover{text-decoration:underline}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.pending-list{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:4px}
</style>
<style id="ponte-design">
/* Ponte entre o CSS antigo da página e o sistema de design (estilo.css). Remover quando a página for redesenhada. */
:root{--blue:var(--tint);--blue2:var(--tint);--gold:#8a6200;--text:var(--label);--muted:var(--label-3);
  --card:var(--surface);--border:var(--separator);--bg:#f5f5f7;--sans:var(--font);--serif:var(--font-display)}
body{font-family:var(--font);background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.01em}
button,input,select,textarea{font-family:var(--font)}
@media (max-width:700px){table{display:block;max-width:100%;overflow-x:auto}}
</style>
</head>

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function _nt(s){return (s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
var GRUPOS = (function(){
  var m = {};
  PREMIOS.forEach(function(p){
    var k = _nt(p.titulo) + '||' + (p.ano || '');
    if(!m[k]) m[k] = {ano:p.ano, titulo:p.titulo, evento:p.evento, professores:[]};
    if(m[k].professores.indexOf(p.professor) < 0) m[k].professores.push(p.professor);
  });
  return Object.keys(m).map(function(k){return m[k];});
})();
function getFiltered() {
  const prof = document.getElementById('fProf').value;
  const sort = document.getElementById('fSort').value;
  let res = GRUPOS.filter(function(g){return !prof || g.professores.indexOf(prof)>=0;});
  if (sort === 'ano_desc') res.sort((a,b) => (b.ano||0)-(a.ano||0));
  else if (sort === 'ano_asc') res.sort((a,b) => (a.ano||0)-(b.ano||0));
  else if (sort === 'prof') res.sort((a,b) => a.professores[0].localeCompare(b.professores[0],'pt-BR') || (b.ano||0)-(a.ano||0));
  return res;
}

function renderStats() {
  const pendentes = TODOS_PROFESSORES.filter(p => !PROCESSADOS.includes(p));
  var profsComPremio = {}; GRUPOS.forEach(function(g){g.professores.forEach(function(p){profsComPremio[p]=1;});});
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-pill"><div class="sv">${GRUPOS.length}</div><div class="sl">Prêmios catalogados</div></div>
    <div class="stat-pill"><div class="sv">${Object.keys(profsComPremio).length}</div><div class="sl">Docentes com prêmio registrado</div></div>
    <div class="stat-pill"><div class="sv">${PROCESSADOS.length}/${TODOS_PROFESSORES.length}</div><div class="sl">Currículos já conferidos nesta seção</div></div>
  `;
  const note = document.getElementById('pending-note');
  if (pendentes.length) {
    note.innerHTML = `⏳ A seção "Prêmios e títulos" do Lattes ainda não foi conferida para <b>${pendentes.length}</b> docente${pendentes.length!==1?'s':''}. Isso não significa que não tenham prêmios — apenas que essa parte do currículo ainda não foi extraída.
      <div class="pending-list">${pendentes.map(esc).join(' · ')}</div>`;
  } else {
    note.style.display = 'none';
  }
}

function profLinks(list){
  return list.map(function(p){return '<a class="proflink" href="professores-biomedicina-ufmt.html">'+esc(p)+'</a>';}).join(', ');
}
function renderTable() {
  const filtered = getFiltered();
  const wrap = document.getElementById('tbl-wrap');
  document.getElementById('tbl-sub').textContent =
    `${filtered.length} prêmio${filtered.length!==1?'s':''} registrado${filtered.length!==1?'s':''}${document.getElementById('fProf').value ? '' : ' (todos os docentes já conferidos)'}`;
  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty">Nenhum prêmio encontrado para este filtro.</div>';
    return;
  }
  wrap.innerHTML = `<table>
    <thead><tr><th style="width:70px">Ano</th><th>Prêmio / Título</th><th>Evento / Instituição</th><th style="width:220px">Docente</th></tr></thead>
    <tbody>
      ${filtered.map(g => `<tr>
        <td class="ano">${g.ano || '—'}</td>
        <td>${esc(g.titulo)}</td>
        <td>${esc(g.evento)}</td>
        <td>${profLinks(g.professores)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderAll() {
  renderStats();
  renderTable();
